apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  labels:
    app.kubernetes.io/name: rag-api
    app.kubernetes.io/part-of: industrial-rag
    release-stage: stable
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-api
        app.kubernetes.io/part-of: industrial-rag
      annotations:
        industrial-rag/config-digest: "sha256:REPLACE_WITH_RELEASE_CONFIG_DIGEST"
    spec:
      serviceAccountName: rag-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rag-api
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: rag-api
      initContainers:
        - name: model-source-init
          image: industrial-rag-api
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.embedding.model_bundle", "prepare"]
          envFrom:
            - configMapRef:
                name: rag-runtime-config
            - secretRef:
                name: rag-runtime
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "8Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
              ephemeral-storage: "16Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: model-cache
              mountPath: /app/models
      containers:
        - name: api
          image: industrial-rag-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: rag-runtime-config
            - secretRef:
                name: rag-runtime
          env:
            - name: RAG_BIND_ADDRESS
              value: "0.0.0.0"
            - name: EMBEDDING_DEVICE
              value: "cuda"
            - name: RERANKER_DEVICE
              value: "cuda"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: model-cache
              mountPath: /app/models
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: model-cache
          emptyDir:
            sizeLimit: 16Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-worker
  labels:
    app.kubernetes.io/name: rag-worker
    app.kubernetes.io/part-of: industrial-rag
    release-stage: stable
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-worker
        app.kubernetes.io/part-of: industrial-rag
      annotations:
        industrial-rag/config-digest: "sha256:REPLACE_WITH_RELEASE_CONFIG_DIGEST"
    spec:
      serviceAccountName: rag-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rag-worker
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: rag-worker
      initContainers:
        - name: model-source-init
          image: industrial-rag-worker
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.embedding.model_bundle", "prepare"]
          envFrom:
            - configMapRef:
                name: rag-runtime-config
            - secretRef:
                name: rag-runtime
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "8Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
              ephemeral-storage: "16Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: model-cache
              mountPath: /app/models
      containers:
        - name: worker
          image: industrial-rag-worker
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: rag-runtime-config
            - secretRef:
                name: rag-runtime
          env:
            - name: EMBEDDING_DEVICE
              value: "cpu"
            - name: RERANKER_DEVICE
              value: "cpu"
            - name: PDF_DEVICE
              value: "cpu"
            - name: MULTIMODAL_DEVICE
              value: "cpu"
          readinessProbe:
            exec:
              command:
                - python
                - -m
                - app.workers.healthcheck
                - readiness
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 8
            failureThreshold: 4
          livenessProbe:
            exec:
              command:
                - python
                - -m
                - app.workers.healthcheck
                - liveness
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 8
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: model-cache
              mountPath: /app/models
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: model-cache
          emptyDir:
            sizeLimit: 16Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  labels:
    app.kubernetes.io/name: rag-frontend
    app.kubernetes.io/part-of: industrial-rag
    release-stage: stable
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-frontend
        app.kubernetes.io/part-of: industrial-rag
      annotations:
        industrial-rag/config-digest: "sha256:REPLACE_WITH_RELEASE_CONFIG_DIGEST"
    spec:
      serviceAccountName: rag-frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rag-frontend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: rag-frontend
      containers:
        - name: frontend
          image: industrial-rag-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: rag-frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-tmp
              mountPath: /tmp
            - name: frontend-runtime-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
        - name: frontend-runtime-config
          configMap:
            name: rag-frontend-config
            items:
              - key: config.js
                path: config.js
