name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: industrial-rag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: industrial-rag/requirements-ci.lock.txt
      - run: python -m pip install --require-hashes -r requirements-ci.lock.txt
      - run: python scripts/validate_dependency_lock.py
      - run: python scripts/validate_release_workflow.py ../.github/workflows/release.yml
      - name: Audit every deployment and evaluation dependency lock
        run: >-
          python scripts/audit_dependency_locks.py
          --check-upstream
          --output-dir "${{ runner.temp }}/dependency-audits"
      - name: Upload machine-readable dependency audits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audits
          path: ${{ runner.temp }}/dependency-audits
          if-no-files-found: warn

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: industrial-rag
    env:
      RAG_ENV: laptop
      POSTGRES_PASSWORD: test-only
      DEEPSEEK_API_KEY: test-only
      RUN_POSTGRES_INTEGRATION: "1"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: rag_test
      PGUSER: postgres
      PGPASSWORD: test-only
      POSTGRES_RUNTIME_USER: rag_runtime_test
      POSTGRES_RUNTIME_PASSWORD: runtime-test-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: industrial-rag/requirements-ci.lock.txt
      - run: python -m pip install --require-hashes -r requirements-ci.lock.txt
      - run: python -m ruff check app tests scripts
      - run: python -m mypy app scripts
      - run: python -m compileall -q app scripts
      - name: Validate production environment contract
        env:
          RAG_ENV: base
          RAG_API_KEY: validation-api-key-012345678901234567890123456789
          RAG_METRICS_TOKEN: validation-metrics-token-012345678901234567890
          POSTGRES_PASSWORD: validation-admin-password
          POSTGRES_APP_PASSWORD: validation-runtime-password
          REDIS_PASSWORD: validation-redis-only
          REDIS_URL: redis://:validation-redis-only@redis:6379/0
          COMPOSE_REDIS_URL: redis://:validation-redis-only@redis:6379/0
          DEEPSEEK_API_KEY: validation-deepseek-key-012345678901234567890
        run: python scripts/validate_production_env.py --env-file ../.env.example --allow-placeholders --allow-local-http
      - run: python scripts/validate_evaluation_assets.py
      - run: |
          python scripts/validate_model_bundle_manifest.py model-sources/model-manifest.json
          cmp --silent model-sources/model-manifest.json docker/model-bundle/model-manifest.example.json
      - run: python scripts/validate_dependency_lock.py
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rag-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rag-frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: validation-only
      POSTGRES_APP_PASSWORD: validation-runtime-only
      RAG_API_KEY: validation-only
      KEYCLOAK_ADMIN_PASSWORD: validation-only
      REDIS_PASSWORD: validation-redis-only
      COMPOSE_REDIS_URL: redis://:validation-redis-only@redis:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare validation-only Compose environment
        run: cp .env.example industrial-rag/.env
      - run: docker compose --env-file industrial-rag/.env -f docker-compose.yml config --quiet
      - run: docker compose --env-file industrial-rag/.env -f docker-compose.yml --profile worker config --quiet
      - run: docker compose --env-file industrial-rag/.env -f docker-compose.yml --profile api --profile frontend config --quiet
      - run: docker compose --env-file industrial-rag/.env -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
      - run: docker compose --env-file industrial-rag/.env -f industrial-rag/docker-compose.yml config --quiet
      - run: docker compose --env-file industrial-rag/.env -f industrial-rag/docker/docker-compose.yml config --quiet

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        image: [api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reclaim hosted-runner disk for backend image
        shell: bash
        run: |
          set -euo pipefail
          # These preinstalled SDKs are unrelated to this Linux/Python image job.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
          df -h /
      # A direct BuildKit build keeps one local layer store. buildx --load
      # duplicated the large CUDA image during export and exhausted hosted-runner disk.
      - name: Build image
        run: >-
          docker build
          --file "industrial-rag/docker/${{ matrix.image }}/Dockerfile"
          --tag "industrial-rag/${{ matrix.image }}:${{ github.sha }}"
          industrial-rag
      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: industrial-rag/${{ matrix.image }}:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          timeout: 15m0s
          exit-code: 1
      - name: Generate image SBOM
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
        with:
          image: industrial-rag/${{ matrix.image }}:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: industrial-rag-${{ matrix.image }}-sbom.cdx.json
          output-file: industrial-rag-${{ matrix.image }}-sbom.cdx.json
      - name: Upload image SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: industrial-rag-${{ matrix.image }}-sbom
          path: industrial-rag-${{ matrix.image }}-sbom.cdx.json
          if-no-files-found: error

  frontend-image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: rag-frontend
          file: rag-frontend/Dockerfile
          push: false
          load: true
          tags: industrial-rag/frontend:${{ github.sha }}
          cache-from: type=gha,scope=industrial-rag-frontend
          cache-to: type=gha,mode=min,scope=industrial-rag-frontend
      - name: Scan built frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: industrial-rag/frontend:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          timeout: 15m0s
          exit-code: 1
      - name: Generate frontend image SBOM
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
        with:
          image: industrial-rag/frontend:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: industrial-rag-frontend-sbom.cdx.json
          output-file: industrial-rag-frontend-sbom.cdx.json
      - name: Upload frontend image SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: industrial-rag-frontend-sbom
          path: industrial-rag-frontend-sbom.cdx.json
          if-no-files-found: error

  production-backend-image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        image: [api, worker]
    env:
      SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reclaim hosted-runner disk for production backend image
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the evaluated production image while making room for its
          # digest-pinned CUDA base on a disposable GitHub-hosted runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
          df -h /
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Create deterministic CI-only model source descriptor
        id: model
        run: >-
          python industrial-rag/scripts/create_model_bundle_ci_fixture.py
          --output "$RUNNER_TEMP/model-bundle"
      - name: Build descriptor-only model source contract image
        id: model_bundle
        env:
          MODEL_MANIFEST_SHA256: ${{ steps.model.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          docker build \
            --file industrial-rag/docker/model-bundle/Dockerfile \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --build-arg "SOURCE_REPOSITORY=$SOURCE_REPOSITORY" \
            --build-arg "MODEL_MANIFEST_SHA256=$MODEL_MANIFEST_SHA256" \
            --tag industrial-rag/model-bundle:ci \
            "$RUNNER_TEMP/model-bundle"
          bundle_digest="$(docker image inspect --format '{{.Id}}' industrial-rag/model-bundle:ci)"
          case "$bundle_digest" in sha256:[0-9a-f][0-9a-f]*) ;; *) exit 1 ;; esac
          echo "bundle_digest=$bundle_digest" >> "$GITHUB_OUTPUT"
      - name: Build production backend image
        env:
          MODEL_BUNDLE_DIGEST: ${{ steps.model_bundle.outputs.bundle_digest }}
          MODEL_MANIFEST_SHA256: ${{ steps.model.outputs.manifest_sha256 }}
        run: >-
          docker build
          --file "industrial-rag/docker/${{ matrix.image }}/Dockerfile.production"
          --build-arg MODEL_BUNDLE_IMAGE=industrial-rag/model-bundle:ci
          --build-arg "MODEL_BUNDLE_DIGEST=$MODEL_BUNDLE_DIGEST"
          --build-arg "MODEL_MANIFEST_SHA256=$MODEL_MANIFEST_SHA256"
          --build-arg "SOURCE_REVISION=$GITHUB_SHA"
          --build-arg "SOURCE_REPOSITORY=$SOURCE_REPOSITORY"
          --tag "industrial-rag/${{ matrix.image }}-production:$GITHUB_SHA"
          industrial-rag
      - name: Verify production image identity and numeric user
        env:
          IMAGE: industrial-rag/${{ matrix.image }}-production:${{ github.sha }}
          MODEL_BUNDLE_DIGEST: ${{ steps.model_bundle.outputs.bundle_digest }}
          MODEL_MANIFEST_SHA256: ${{ steps.model.outputs.manifest_sha256 }}
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "10001:10001"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$IMAGE")" = "$SOURCE_REPOSITORY"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.model-bundle-digest"}}' "$IMAGE")" = "$MODEL_BUNDLE_DIGEST"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.model-manifest-sha256"}}' "$IMAGE")" = "$MODEL_MANIFEST_SHA256"
      - name: Scan production backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: industrial-rag/${{ matrix.image }}-production:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          timeout: 15m0s
          exit-code: 1
      - name: Generate production backend SBOM
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
        with:
          image: industrial-rag/${{ matrix.image }}-production:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: industrial-rag-${{ matrix.image }}-production-sbom.cdx.json
          output-file: industrial-rag-${{ matrix.image }}-production-sbom.cdx.json
      - name: Upload production backend SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: industrial-rag-${{ matrix.image }}-production-sbom
          path: industrial-rag-${{ matrix.image }}-production-sbom.cdx.json
          if-no-files-found: error

  production-frontend-image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production frontend image
        run: >-
          docker build
          --file rag-frontend/Dockerfile.production
          --build-arg "SOURCE_REVISION=$GITHUB_SHA"
          --build-arg "SOURCE_REPOSITORY=$SOURCE_REPOSITORY"
          --tag "industrial-rag/frontend-production:$GITHUB_SHA"
          rag-frontend
      - name: Verify production frontend identity and numeric user
        env:
          IMAGE: industrial-rag/frontend-production:${{ github.sha }}
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "101:101"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$IMAGE")" = "$SOURCE_REPOSITORY"
      - name: Scan production frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: industrial-rag/frontend-production:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          timeout: 15m0s
          exit-code: 1
      - name: Generate production frontend SBOM
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
        with:
          image: industrial-rag/frontend-production:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: industrial-rag-frontend-production-sbom.cdx.json
          output-file: industrial-rag-frontend-production-sbom.cdx.json
      - name: Upload production frontend SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: industrial-rag-frontend-production-sbom
          path: industrial-rag-frontend-production-sbom.cdx.json
          if-no-files-found: error

  kubernetes-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: industrial-rag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: industrial-rag/requirements-ci.lock.txt
      - run: python -m pip install --require-hashes -r requirements-ci.lock.txt
      - run: kubectl kustomize deploy/kustomize/production > "$RUNNER_TEMP/industrial-rag-production.yaml"
      - run: python scripts/validate_kubernetes_manifests.py --manifest "$RUNNER_TEMP/industrial-rag-production.yaml" --allow-placeholders
      - run: |
          python scripts/validate_model_bundle_manifest.py model-sources/model-manifest.json
          cmp --silent model-sources/model-manifest.json docker/model-bundle/model-manifest.example.json
      - name: Upload rendered Kubernetes manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: industrial-rag-kubernetes-manifest
          path: ${{ runner.temp }}/industrial-rag-production.yaml
          if-no-files-found: error
