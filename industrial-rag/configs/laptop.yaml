# Laptop/local development configuration.

app:
  name: "RAG Knowledge QA System"
  version: "1.0.0"
  debug: true
  host: "127.0.0.1"
  port: 8000

llm:
  text:
    provider: "openai_compatible"  # 改用DeepSeek
    claude:
      model_name: "claude-sonnet-4-6"
      api_key: "${CLAUDE_API_KEY}"
      base_url: "https://api.anthropic.com"
      temperature: 0.3
      max_tokens: 4096
      timeout: 60
    openai_compatible:
      model_name: "deepseek-chat"
      api_key: "${DEEPSEEK_API_KEY}"
      base_url: "https://api.deepseek.com/v1"
      temperature: 0.3
      max_tokens: 4096
      timeout: 60
    zhipu:
      model_name: "glm-4-plus"
      api_key: "${ZHIPU_API_KEY}"
      temperature: 0.3
      max_tokens: 4096
      timeout: 60
  vision:
    enabled: false

embedding:
  model_name: "BAAI/bge-m3"
  model_path: "E:/RAG/models/bge-m3"
  device: "cuda"
  batch_size: 32
  max_length: 8192
  dimension: 1024
  normalize_embeddings: true
  use_dense: true
  use_sparse: false
  use_colbert: false

reranker:
  enabled: true
  model_name: "BAAI/bge-reranker-v2-m3"
  model_path: "E:/RAG/models/bge-reranker-v2-m3"
  device: "cuda"
  batch_size: 1
  max_length: 512
  top_n: 5
  # 重排后的绝对相关性阈值，作用于 sigmoid(logit) 校准概率（跨 query 可比）。
  # 低于此值的文档被丢弃，允许返回 0 条（"无相关法条" 是合法答案）。
  # null = 关闭阈值过滤（仅按概率排序后取 top_n）。需在真实法律语料上校准后再设值，建议从 0.5 起步。
  score_threshold: null

postgres:
  host: "localhost"
  port: 5432
  database: "rag_db"
  user: "postgres"
  password: "${POSTGRES_PASSWORD}"
  min_pool_size: 1
  max_pool_size: 5
  command_timeout: 60

chroma:
  persist_directory: "./data/chroma"
  collection:
    name: "rag_documents"
    dimension: 1024
    distance: "cosine"
  enable_partition: true
  partitions: ["contract", "manual", "process", "policy", "general"]

redis:
  enabled: true
  url: "redis://localhost:16379/0"
  max_connections: 20
  semantic_cache:
    enabled: true
    ttl: 3600
    similarity_threshold: 0.95
    max_cache_size: 5000

queue:
  provider: "memory"

document_processing:
  upload_dir: "./data/uploads"
  supported_formats: ["pdf", "txt", "md", "docx", "doc", "xlsx", "xls"]
  max_file_size: 52428800
  batch_size: 16
  pdf:
    engine: "mineru"
    parse_method: "auto"
    device: "cuda"
    output_format: "md"
    formula_enable: true
    table_enable: true
  chunking:
    strategy: "parent_child"
    chunk_size: 800
    chunk_overlap: 120
    min_chunk_size: 80
    separators: ["\n# ", "\n## ", "\n### ", "\n\n", "\n", "。", "；", "，", ". ", "; ", ", ", " "]
    parent_child:
      enabled: true
      parent_size: 3200
      child_size: 800
      child_overlap: 200

rag:
  retrieval:
    use_postgres: true
    enable_hybrid: true
    top_k: 5
    # 重排前的召回分兜底阈值，仅挡掉完全无关的召回；真正的相关性裁决交给重排器
    # （reranker.score_threshold，作用于 sigmoid 校准概率）。
    similarity_threshold: 0.05
    enable_rerank: true
    rerank_candidate_multiplier: 4
    rerank_min_candidates: 20
    rerank_max_candidates: 80
    max_chunks_per_document: 6
    rrf_k: 60
    enable_dynamic_topk: true
    dynamic_topk_threshold: 0.5
    query_understanding:
      enable_coreference: true
      enable_decomposition: true
      # 查询改写：把口语/场景化提问改写成法言法语再检索（原查询+改写查询合并）。
      enable_rewrite: true
      max_subqueries: 3
  generation:
    system_prompt: |
      你是一个专业的知识库问答助手。**严格遵守以下规则**：

      【核心规则】
      1. **只使用提供的上下文回答**：绝对禁止使用你的训练知识或常识！
      2. **不编造法条或条款号**：如果上下文中没有明确提到某个法条（如第XXX条），绝不能引用它！
      3. **上下文不足时明确说明**：如果上下文不包含足够信息，必须说"根据提供的上下文，无法回答该问题"。
      4. **逐字引用法条时标注来源**：引用具体条文时，必须注明"来源：相关文档X"。

      【检查清单】
      - 回答前检查：我引用的每个法条号、每个条款，是否都在上下文中出现？
      - 如果没有，立即删除，改为"上下文未提供相关条款"。
      - 不要使用"根据《XX法》第XX条"这样的表述，除非上下文明确包含该条文。

      【回答格式】
      - 结构化、简洁、可追溯
      - 引用来源：相关文档X（序号）
    max_context_length: 6000
    temperature: 0.1
    max_tokens: 2048
    context_template: |
      ## 相关文档 {index}
      来源: {source}
      分数: {score:.4f}

      {content}
  evaluation:
    enable_llm_judge: true
    enable_ragas: true
    top_n_retrieval: 5

monitoring:
  prometheus:
    enabled: false

logging:
  level: "INFO"
  format: "text"

security:
  cors:
    enabled: true
    allow_origins: ["*"]
    allow_methods: ["*"]
    allow_headers: ["*"]

performance:
  batch_embedding: true
  batch_size: 16
  max_concurrent_requests: 10
  worker_threads: 2
