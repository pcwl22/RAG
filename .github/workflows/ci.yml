name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: industrial-rag
    env:
      RAG_ENV: laptop
      POSTGRES_PASSWORD: test-only
      DEEPSEEK_API_KEY: test-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: industrial-rag/requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m ruff check app tests scripts
      - run: python -m compileall -q app
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rag-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: validation-only
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f industrial-rag/docker-compose.yml config --quiet
      - run: docker compose -f industrial-rag/docker/docker-compose.yml config --quiet
