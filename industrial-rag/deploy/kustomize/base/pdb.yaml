      app.kubernetes.io/name: rag-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rag-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-frontend
