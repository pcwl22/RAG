version: 2
updates:
  - package-ecosystem: pip
    directory: /industrial-rag
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /rag-frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-runtime:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /industrial-rag/docker/api
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /industrial-rag/docker/worker
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /rag-frontend
    schedule:
      interval: weekly
      day: monday
