apiVersion: v1
kind: Service
metadata:
  name: rag-api
  labels:
    app.kubernetes.io/name: rag-api
    app.kubernetes.io/part-of: industrial-rag
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rag-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: rag-frontend
  labels:
    app.kubernetes.io/name: rag-frontend
    app.kubernetes.io/part-of: industrial-rag
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rag-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
