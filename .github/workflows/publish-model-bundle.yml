name: Publish approved Hugging Face model source descriptor

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production-model-source
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: production-model-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
      COSIGN_VERSION: v3.1.2
      COSIGN_LINUX_AMD64_SHA256: f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf

    steps:
      - name: Check out the exact protected source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate the immutable model source descriptor
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          descriptor="industrial-rag/model-sources/model-manifest.json"
          example="industrial-rag/docker/model-bundle/model-manifest.example.json"
          generated="$RUNNER_TEMP/generated-model-manifest.json"
          model_build_dir="$RUNNER_TEMP/approved-model-source"
          evidence_dir="$RUNNER_TEMP/approved-model-source-evidence"

          python industrial-rag/scripts/validate_model_bundle_manifest.py "$descriptor"
          python industrial-rag/scripts/build_model_bundle_manifest.py --output "$generated"
          cmp --silent "$generated" "$descriptor"
          cmp --silent "$descriptor" "$example"

          mkdir -p "$model_build_dir" "$evidence_dir"
          cp "$descriptor" "$model_build_dir/model-manifest.json"
          cp industrial-rag/docker/model-bundle/Dockerfile "$model_build_dir/Dockerfile"
          cp "$descriptor" "$evidence_dir/model-manifest.json"
          actual_manifest_sha="sha256:$(sha256sum "$descriptor" | awk '{print $1}')"
          {
            echo "MODEL_BUILD_DIR=$model_build_dir"
            echo "MODEL_EVIDENCE_DIR=$evidence_dir"
            echo "MODEL_MANIFEST_SHA256=$actual_manifest_sha"
          } >> "$GITHUB_ENV"

      - name: Authenticate to the repository package namespace
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REGISTRY_TOKEN"
          printf '%s' "$REGISTRY_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Install the checksum-pinned Cosign binary
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/cosign"
          cosign_path="$install_dir/cosign"
          mkdir -p "$install_dir"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --retry 3 \
            --retry-delay 2 \
            --retry-connrefused \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64" \
            --output "$cosign_path"
          printf '%s  %s\n' "$COSIGN_LINUX_AMD64_SHA256" "$cosign_path" |
            sha256sum --check --strict
          chmod 0500 "$cosign_path"
          "$cosign_path" version
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push the descriptor-only artifact
        id: build
        shell: bash
        run: |
          set -euo pipefail
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}/approved-model-source"
          image_tag="hf-source-$GITHUB_SHA"
          metadata_file="$RUNNER_TEMP/approved-model-source-build-metadata.json"

          docker buildx build \
            --file "$MODEL_BUILD_DIR/Dockerfile" \
            --platform linux/amd64 \
            --push \
            --provenance=false \
            --sbom=false \
            --metadata-file "$metadata_file" \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --build-arg "SOURCE_REPOSITORY=https://github.com/$GITHUB_REPOSITORY" \
            --build-arg "MODEL_MANIFEST_SHA256=$MODEL_MANIFEST_SHA256" \
            --tag "$image_repository:$image_tag" \
            "$MODEL_BUILD_DIR"

          image_digest="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["containerimage.digest"])' "$metadata_file")"
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Buildx did not return an immutable image digest" >&2
            exit 1
          fi
          image_ref="$image_repository@$image_digest"
          {
            echo "MODEL_BUNDLE_IMAGE=$image_ref"
            echo "MODEL_BUNDLE_DIGEST=$image_digest"
            echo "MODEL_BUNDLE_TAG=$image_repository:$image_tag"
          } >> "$GITHUB_ENV"
          {
            echo "image=$image_ref"
            echo "digest=$image_digest"
            echo "manifest_sha256=$MODEL_MANIFEST_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Sign and verify the immutable source descriptor
        shell: bash
        run: |
          set -euo pipefail
          signer_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-model-bundle.yml@refs/heads/main"
          cosign sign --yes "$MODEL_BUNDLE_IMAGE"
          cosign verify \
            --certificate-identity "$signer_identity" \
            --certificate-oidc-issuer "$COSIGN_CERTIFICATE_OIDC_ISSUER" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            "$MODEL_BUNDLE_IMAGE" > "$MODEL_EVIDENCE_DIR/signature-verification.json"

          docker pull "$MODEL_BUNDLE_IMAGE"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$MODEL_BUNDLE_IMAGE")" = "https://github.com/$GITHUB_REPOSITORY"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$MODEL_BUNDLE_IMAGE")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.model-manifest-sha256" }}' "$MODEL_BUNDLE_IMAGE")" = "$MODEL_MANIFEST_SHA256"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.industrial-rag.model-weights" }}' "$MODEL_BUNDLE_IMAGE")" = "absent"

          model_container="$(docker create "$MODEL_BUNDLE_IMAGE" /nonexistent)"
          trap 'docker rm -f "$model_container" >/dev/null 2>&1 || true' EXIT
          docker cp \
            "$model_container:/models/model-manifest.json" \
            "$MODEL_EVIDENCE_DIR/published-model-manifest.json"
          if docker cp "$model_container:/models/bge-m3" "$RUNNER_TEMP/unexpected-model"; then
            echo "descriptor artifact unexpectedly contains model weights" >&2
            exit 1
          fi
          docker rm "$model_container" >/dev/null
          trap - EXIT
          published_manifest_sha="sha256:$(sha256sum "$MODEL_EVIDENCE_DIR/published-model-manifest.json" | awk '{print $1}')"
          test "$published_manifest_sha" = "$MODEL_MANIFEST_SHA256"

      - name: Write immutable publication evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence_dir = Path(os.environ["MODEL_EVIDENCE_DIR"])
          manifest = json.loads((evidence_dir / "model-manifest.json").read_text(encoding="utf-8"))
          record = {
              "schema_version": 2,
              "artifact_kind": "huggingface-model-source-descriptor",
              "contains_model_weights": False,
              "image": os.environ["MODEL_BUNDLE_IMAGE"],
              "digest": os.environ["MODEL_BUNDLE_DIGEST"],
              "manifest_sha256": os.environ["MODEL_MANIFEST_SHA256"],
              "source_repository": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}",
              "source_revision": os.environ["GITHUB_SHA"],
              "signer_identity": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  "/.github/workflows/publish-model-bundle.yml@refs/heads/main"
              ),
              "models": manifest["models"],
          }
          (evidence_dir / "model-source.json").write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (evidence_dir / "model-source.env").write_text(
              "\n".join(
                  (
                      f"MODEL_BUNDLE_IMAGE={record['image']}",
                      f"MODEL_MANIFEST_SHA256={record['manifest_sha256']}",
                      f"MODEL_BUNDLE_SOURCE_REPOSITORY={record['source_repository']}",
                      f"MODEL_BUNDLE_SOURCE_REVISION={record['source_revision']}",
                      f"MODEL_BUNDLE_CERTIFICATE_IDENTITY={record['signer_identity']}",
                  )
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload approved model-source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: industrial-rag-approved-model-source
          path: ${{ runner.temp }}/approved-model-source-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Remove registry credentials
        if: ${{ always() }}
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true
