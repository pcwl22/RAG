name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: industrial-rag
    env:
      RAG_ENV: laptop
      POSTGRES_PASSWORD: test-only
      DEEPSEEK_API_KEY: test-only
      RUN_POSTGRES_INTEGRATION: "1"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: rag_test
      PGUSER: postgres
      PGPASSWORD: test-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: industrial-rag/requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m ruff check app tests scripts
      - run: python -m compileall -q app
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rag-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: validation-only
      RAG_API_KEY: validation-only
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f industrial-rag/docker-compose.yml config --quiet
      - run: docker compose -f industrial-rag/docker/docker-compose.yml config --quiet

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, worker]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: industrial-rag
          file: industrial-rag/docker/${{ matrix.image }}/Dockerfile
          push: false
          cache-from: type=gha,scope=industrial-rag-${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=industrial-rag-${{ matrix.image }}
