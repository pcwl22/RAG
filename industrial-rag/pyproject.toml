[project]
name = "industrial-rag"
version = "1.0.0"
description = "Industrial-grade RAG system with Chinese and multimodal support"
authors = [{name = "Your Team"}]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}

dependencies = [
    # Core Framework
    "fastapi>=0.139.2,<0.140",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=22.0,<24; platform_system != 'Windows'",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",

    # LLM & RAG
    "transformers>=5.16.1,<6",
    "torch>=2.13.0,<2.14",
    "sentence-transformers>=6.0.0,<7",

    # LLM API Clients
    "anthropic>=0.25.0",     # Claude
    "openai>=1.30.0",        # OpenAI-compatible (DeepSeek)

    # Vector Database
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.0",  # PostgreSQL sync driver

    # Document Processing. PyMuPDF is the default PDF parser in the runtime
    # image; MinerU is optional because its Torch/Transformers matrix differs.
    "PyMuPDF>=1.23.0",
    "python-docx>=1.1.0",      # Word
    "openpyxl>=3.1.0",         # Excel
    "pandas>=2.2.0",

    # Message Queue
    "celery[redis]>=5.3.0",

    # S3-compatible object storage for distributed Celery uploads
    "boto3>=1.35.0,<2",

    # Monitoring & Logging
    "prometheus-client>=0.20.0",
    "prometheus-fastapi-instrumentator>=8.0.0,<9",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",

    # HTTP & Network
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "PyJWT[crypto]>=2.9.0,<3",

    # Configuration
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",

    # Utils
    "tiktoken>=0.6.0",
]

[project.optional-dependencies]
legacy-ui = [
    "streamlit>=1.30.0",
]

llama-index = [
    "llama-index>=0.10.0",
    "llama-index-llms-vllm>=0.1.0",
    "llama-index-embeddings-huggingface>=0.1.0",
]

multimodal = [
    "open-clip-torch>=2.24.0",
    "timm>=0.9.0",
    "pillow>=10.2.0",
    "python-pptx>=0.6.23",
]

rabbitmq = [
    "aio-pika>=9.4.0",
]

mineru = [
    "magic-pdf[full]>=0.7.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",  # for TestClient
    "ruff>=0.2.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.12,<7",
    "types-redis>=4.6,<5",
    "types-psycopg2>=2.9,<3",
    "pandas-stubs>=2.2,<3",
    "ipython>=8.21.0",
    "jupyter>=1.0.0",
]

benchmark = [
    "locust>=2.20.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

# The protected judge is deliberately dependency-minimal. Do not add Ragas,
# LangChain, cache deserializers, URL loaders, or multimodal fetchers here.
evaluation = [
    "openai==3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
# Targets 3.12 although the package supports >=3.11. NumPy's bundled stubs,
# reached transitively through openai, use `type` statements that mypy refuses
# to parse below 3.12, and that aborts the entire run. Real 3.11 compatibility
# stays guarded by the CI matrix, which runs the test suite on 3.11 and 3.12.
python_version = "3.12"
# Use third-party type information without reporting errors inside those
# packages. Not "skip": that would discard the type information rather than
# just silencing other people's errors.
follow_imports = "silent"
# scripts/ has no __init__.py, so without this mypy resolves the same file as
# both "postgres_cli" and "scripts.postgres_cli" and refuses to check anything.
explicit_package_bases = true
mypy_path = "."
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Ship no type information, or live only in the GPU/evaluation extras that CI
# does not install. Every one of these is imported behind a try/except.
module = [
    "celery.*",
    "fitz.*",
    "jinja2.*",
    "magic_pdf.*",
    "sentence_transformers.*",
    "tiktoken.*",
    "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=app --cov-report=html --cov-report=term-missing --basetemp=.pytest_tmp -p no:cacheprovider"

[tool.coverage.report]
# Ratchet this upward as PostgreSQL, cache, model and upload integration tests land.
fail_under = 60
