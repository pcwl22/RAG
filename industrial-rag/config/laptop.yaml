# Laptop/local development configuration.

app:
  name: "RAG Knowledge QA System"
  version: "1.0.0"
  debug: true
  host: "127.0.0.1"
  port: 8000

llm:
  text:
    provider: "openai_compatible"  # 改用DeepSeek
    healthcheck_timeout_seconds: 5
    claude:
      model_name: "claude-sonnet-4-6"
      api_key: "${CLAUDE_API_KEY}"
      base_url: "https://api.anthropic.com"
      temperature: 0.3
      max_tokens: 4096
      timeout: 60
      healthcheck_ttl_seconds: 30
    openai_compatible:
      model_name: "${DEEPSEEK_MODEL}"
      api_key: "${DEEPSEEK_API_KEY}"
      base_url: "${DEEPSEEK_API_URL}"
      temperature: 0.3
      max_tokens: 4096
      timeout: 60
      max_retries: 2
      retry_backoff_seconds: 0.5
      healthcheck_ttl_seconds: 30
    zhipu:
      model_name: "glm-4-plus"
      api_key: "${ZHIPU_API_KEY}"
      base_url: "https://open.bigmodel.cn/api/paas/v4/"
      temperature: 0.3
      max_tokens: 4096
      timeout: 60
      healthcheck_ttl_seconds: 30
  vision:
    enabled: false

embedding:
  model_name: "BAAI/bge-m3"
  model_revision: "5617a9f61b028005a4858fdac845db406aefb181"
  model_path: "E:/RAG/models/bge-m3"
  device: "cuda"
  allow_cpu_fallback: true
  batch_size: 32
  max_length: 8192
  dimension: 1024
  normalize_embeddings: true
  use_dense: true
  use_sparse: false
  use_colbert: false

reranker:
  enabled: true
  failure_mode: "closed"
  model_name: "BAAI/bge-reranker-v2-m3"
  model_revision: "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"
  model_path: "E:/RAG/models/bge-reranker-v2-m3"
  device: "cuda"
  allow_cpu_fallback: true
  batch_size: 1
  max_length: 512
  top_n: 5
  # 不对交叉编码器概率使用未经校准的绝对阈值。范围判定由确定性的
  # out-of-scope 规则负责，相关性由排序与 top_n 控制；如重新启用阈值，
  # 必须先在独立校准集上证明不会删除有效法条。
  score_threshold: null

postgres:
  host: "localhost"
  # 避免与同机其他 PostgreSQL 项目的默认 5432 端口冲突。
  port: 15432
  database: "rag_db"
  user: "postgres"
  password: "${POSTGRES_PASSWORD}"
  sslmode: "${POSTGRES_SSLMODE}"
  sslrootcert: "${POSTGRES_SSLROOTCERT}"
  auto_migrate: true
  min_pool_size: 1
  max_pool_size: 5
  ivfflat_probes: 10
  command_timeout: 60
  lock_timeout: 5

redis:
  enabled: true
  url: "redis://localhost:16379/0"
  max_connections: 20
  socket_connect_timeout_seconds: 2
  socket_timeout_seconds: 2
  operation_timeout_seconds: 2
  health_check_interval_seconds: 30
  semantic_cache:
    enabled: true
    ttl: 3600
    # Deterministic context-aware answer cache. This is not vector similarity.
    cache_version: "1"

queue:
  provider: "memory"
  reconciliation:
    enabled: false
    interval_seconds: 30
    redispatch_after_seconds: 90
    batch_size: 100
    dispatch_lease_seconds: 60
    max_dispatch_attempts: 10
    completion_receipt_retention_seconds: 86400
    producer_timeout_seconds: 10

object_storage:
  enabled: false
  endpoint_url: "${S3_ENDPOINT_URL}"
  bucket: "${S3_BUCKET}"
  region: "${S3_REGION}"
  access_key_id: "${S3_ACCESS_KEY_ID}"
  secret_access_key: "${S3_SECRET_ACCESS_KEY}"
  require_tls: false
  addressing_style: "path"
  failed_prefix: "failed"
  ca_bundle: "${S3_CA_BUNDLE}"
  connect_timeout_seconds: 3
  read_timeout_seconds: 15
  max_pool_connections: 20

document_processing:
  upload_dir: "./data/uploads"
  supported_formats: ["pdf", "txt", "md", "docx", "xlsx"]
  max_file_size: 52428800
  max_archive_entries: 5000
  max_archive_uncompressed_size: 536870912
  max_archive_compression_ratio: 200
  batch_size: 16
  pdf:
    engine: "mineru"
    parse_method: "auto"
    device: "cuda"
    output_format: "md"
    formula_enable: true
    table_enable: true
  chunking:
    strategy: "parent_child"
    chunk_size: 800
    chunk_overlap: 120
    min_chunk_size: 80
    separators: ["\n# ", "\n## ", "\n### ", "\n\n", "\n", "。", "；", "，", ". ", "; ", ", ", " "]
    parent_child:
      enabled: true
      parent_size: 3200
      child_size: 800
      child_overlap: 200

rag:
  retrieval:
    enable_hybrid: true
    top_k: 5
    # 重排前的召回分兜底阈值，仅挡掉完全无关的召回；真正的相关性裁决交给重排器
    # （reranker.score_threshold，作用于 sigmoid 校准概率）。
    similarity_threshold: 0.05
    enable_rerank: true
    rerank_candidate_multiplier: 4
    # 0 = 不在重排前按源文件截断；法典通常是一份文件，过早截断会丢掉正确条文。
    # 最终上下文数量仍由 top_k 和动态上下文选择控制。
    max_chunks_per_document: 0
    rerank_min_candidates: 80
    rerank_max_candidates: 120
    rrf_k: 60
    enable_dynamic_topk: true
    dynamic_topk_threshold: 0.5
    # 多查询合并后保留足够候选，再用共同查询重排并动态裁剪生成上下文。
    merge_candidate_multiplier: 8
    dynamic_context_selection: true
    flat_score_top_n: 2
    min_final_rerank_spread: 0.05
    min_final_rerank_gap: 0.08
    query_understanding:
      enable_coreference: true
      enable_decomposition: true
      # 查询改写：把口语/场景化提问改写成法言法语再检索（原查询+改写查询合并）。
      enable_rewrite: true
      max_subqueries: 3
  generation:
    answer_contract:
      enabled: true
      max_retries: 1
    system_prompt: |
      你是一个专业的知识库问答助手。**严格遵守以下规则**：

      【核心规则】
      1. **只使用提供的上下文回答**：绝对禁止使用你的训练知识或常识！
      2. **不编造法条或条款号**：如果上下文中没有明确提到某个法条（如第XXX条），绝不能引用它！
      3. **上下文不足时明确说明**：如果上下文不包含足够信息，必须说"根据提供的上下文，无法回答该问题"。
      4. **逐字引用法条时标注来源**：引用具体条文时，必须注明"来源：相关文档X"。

      【检查清单】
      - 回答前检查：我引用的每个法条号、每个条款，是否都在上下文中出现？
      - 如果没有，立即删除，改为"上下文未提供相关条款"。
      - 不要使用"根据《XX法》第XX条"这样的表述，除非上下文明确包含该条文。

      【回答格式】
      - 结构化、简洁、可追溯
      - 引用来源：相关文档X（序号）
    max_context_length: 6000
    temperature: 0.0
    max_tokens: 1024
    context_template: |
      ## 相关文档 {index}
      来源: {source}
      分数: {score:.4f}

      {content}
monitoring:
  prometheus:
    enabled: false
    path: "/internal/metrics"
    header_name: "X-Metrics-Token"
    token: "${RAG_METRICS_TOKEN}"

logging:
  level: "INFO"
  format: "text"

security:
  oidc:
    enabled: false
    issuer: "${OIDC_ISSUER}"
    audience: "${OIDC_AUDIENCE}"
    jwks_url: "${OIDC_JWKS_URL}"
    tenant_claim: "tenant_id"
    roles_claim: "realm_access.roles"
    algorithms: ["RS256"]
  api_key:
    enabled: false
    header_name: "X-API-Key"
  cors:
    enabled: true
    allow_origins: ["*"]
    allow_credentials: false
    allow_methods: ["*"]
    allow_headers: ["*"]

performance:
  batch_embedding: true
  batch_size: 16
  max_concurrent_requests: 10
  tenant_max_concurrent_requests: 4
  tenant_requests_per_minute: 120
  tenant_rate_limit_fail_open: true
  max_tracked_tenants: 1000
  request_queue_timeout_seconds: 5
  max_chat_total_chars: 60000
  max_chat_input_tokens: 16000
  # Local embedding and reranking are synchronous GPU workloads. Keep them in
  # a bounded executor so concurrent HTTP requests do not block the event loop
  # or overcommit GPU memory.
  gpu_inference_workers: 1
