version: '3.8'

services:
  # Nginx 负载均衡
  nginx:
    image: nginx:1.25-alpine
    container_name: rag-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api-1
      - api-2
    restart: unless-stopped
    networks:
      - rag-network

  # FastAPI 服务 (多实例)
  api-1:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    container_name: rag-api-1
    environment:
      - INSTANCE_ID=1
      - REDIS_URL=redis://redis:6379/0
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - VLLM_TEXT_URL=http://vllm-text:8000
      - VLLM_VISION_URL=http://vllm-vision:8001
      - LOG_LEVEL=INFO
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data
      - ../config:/app/config:ro
      - ../prompts:/app/prompts:ro
    depends_on:
      - redis
      - milvus-standalone
      - rabbitmq
      - vllm-text
      - vllm-vision
    restart: unless-stopped
    networks:
      - rag-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api-2:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    container_name: rag-api-2
    environment:
      - INSTANCE_ID=2
      - REDIS_URL=redis://redis:6379/0
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - VLLM_TEXT_URL=http://vllm-text:8000
      - VLLM_VISION_URL=http://vllm-vision:8001
      - LOG_LEVEL=INFO
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data
      - ../config:/app/config:ro
      - ../prompts:/app/prompts:ro
    depends_on:
      - redis
      - milvus-standalone
      - rabbitmq
      - vllm-text
      - vllm-vision
    restart: unless-stopped
    networks:
      - rag-network

  # vLLM 文本推理服务 (Qwen2.5-72B)
  vllm-text:
    image: vllm/vllm-openai:v0.4.2
    container_name: rag-vllm-text
    command: >
      --model /models/Qwen2.5-72B-Instruct
      --served-model-name qwen2.5-72b
      --trust-remote-code
      --tensor-parallel-size 2
      --max-model-len 32768
      --gpu-memory-utilization 0.95
      --enable-chunked-prefill
      --disable-log-requests
      --port 8000
    ports:
      - "8100:8000"
    volumes:
      - ../models/Qwen2.5-72B-Instruct:/models/Qwen2.5-72B-Instruct:ro
    shm_size: '16gb'
    restart: unless-stopped
    networks:
      - rag-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1']  # 使用GPU 0和1
              capabilities: [gpu]

  # vLLM 多模态推理服务 (Qwen2-VL-7B)
  vllm-vision:
    image: vllm/vllm-openai:v0.4.2
    container_name: rag-vllm-vision
    command: >
      --model /models/Qwen2-VL-7B-Instruct
      --served-model-name qwen2-vl-7b
      --trust-remote-code
      --max-model-len 8192
      --gpu-memory-utilization 0.9
      --port 8001
    ports:
      - "8101:8001"
    volumes:
      - ../models/Qwen2-VL-7B-Instruct:/models/Qwen2-VL-7B-Instruct:ro
    shm_size: '8gb'
    restart: unless-stopped
    networks:
      - rag-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']  # 使用GPU 2
              capabilities: [gpu]

  # Celery Worker (文档处理)
  worker:
    build:
      context: ..
      dockerfile: docker/worker/Dockerfile
    container_name: rag-worker
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info --concurrency=4
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data
      - ../config:/app/config:ro
      - ../prompts:/app/prompts:ro
    depends_on:
      - redis
      - rabbitmq
      - milvus-standalone
    restart: unless-stopped
    networks:
      - rag-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['3']  # 使用GPU 3做嵌入
              capabilities: [gpu]

  # Redis (缓存 + Celery Broker)
  redis:
    image: redis:7.2-alpine
    container_name: rag-redis
    command: redis-server --appendonly yes --maxmemory 8gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - rag-network

  # RabbitMQ (消息队列)
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rag-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - rag-network

  # Milvus Standalone
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: rag-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped
    networks:
      - rag-network

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rag-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - rag-network

  milvus-standalone:
    image: milvusdb/milvus:v2.4.1
    container_name: rag-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
      - ./milvus/milvus.yaml:/milvus/configs/milvus.yaml
    ports:
      - "19530:19530"
      - "9091:9091"  # Metrics
    depends_on:
      - etcd
      - minio
    restart: unless-stopped
    networks:
      - rag-network

  # Milvus Web UI (Attu)
  attu:
    image: zilliz/attu:v2.3.10
    container_name: rag-attu
    environment:
      - MILVUS_URL=milvus-standalone:19530
    ports:
      - "8001:3000"
    depends_on:
      - milvus-standalone
    restart: unless-stopped
    networks:
      - rag-network

  # Prometheus (监控)
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: rag-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - rag-network

  # Grafana (可视化)
  grafana:
    image: grafana/grafana:10.3.3
    container_name: rag-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - rag-network

volumes:
  redis-data:
  rabbitmq-data:
  etcd-data:
  minio-data:
  milvus-data:
  prometheus-data:
  grafana-data:

networks:
  rag-network:
    driver: bridge
