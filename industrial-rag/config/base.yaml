# 应用配置
app:
  name: "Industrial RAG System"
  version: "1.0.0"
  debug: false
  host: "0.0.0.0"
  port: 8000

# LLM配置
llm:
  text:
    provider: "openai_compatible"
    healthcheck_timeout_seconds: 5
    claude:
      model_name: "claude-sonnet-4-6"
      api_key: "${CLAUDE_API_KEY}"
      base_url: "https://api.anthropic.com"
      temperature: 0.3
      max_tokens: 4096
      timeout: 60
      healthcheck_ttl_seconds: 30
    openai_compatible:
      model_name: "deepseek-chat"
      api_key: "${DEEPSEEK_API_KEY}"
      base_url: "https://api.deepseek.com/v1"
      temperature: 0.3
      max_tokens: 4096
      timeout: 60
      healthcheck_ttl_seconds: 30
    zhipu:
      model_name: "glm-4-plus"
      api_key: "${ZHIPU_API_KEY}"
      base_url: "https://open.bigmodel.cn/api/paas/v4/"
      temperature: 0.3
      max_tokens: 4096
      timeout: 60
      healthcheck_ttl_seconds: 30

  vision:
    enabled: false

# 嵌入模型配置
embedding:
  model_name: "BAAI/bge-m3"
  model_revision: "bge-m3-local-2026-06"
  model_path: "/app/models/bge-m3"
  device: "cuda"
  batch_size: 32
  max_length: 8192
  normalize_embeddings: true
  # BGE-M3支持混合检索
  use_dense: true
  use_sparse: false  # Milvus 2.4暂不支持，设为false
  use_colbert: false

# 重排序模型
reranker:
  enabled: true
  failure_mode: "closed"
  model_name: "BAAI/bge-reranker-v2-m3"
  model_path: "/app/models/bge-reranker-v2-m3"
  device: "cuda"
  batch_size: 16
  top_n: 5
  # 重排后的绝对相关性阈值；多查询分数需再用原始问题统一重排后才可比较。
  # 低于此值的文档被丢弃，允许返回 0 条（"无相关法条" 是合法答案）。
  # null = 关闭阈值过滤（仅按概率排序后取 top_n）。需在真实法律语料上校准后再设值，建议从 0.5 起步。
  score_threshold: 0.5

postgres:
  host: "postgres"
  port: 5432
  database: "rag_db"
  user: "${POSTGRES_USER}"
  password: "${POSTGRES_PASSWORD}"
  auto_migrate: false
  min_pool_size: 1
  max_pool_size: 10
  ivfflat_probes: 10
  connect_timeout: 5
  command_timeout: 60
  keepalives_idle: 30
  keepalives_interval: 10
  keepalives_count: 3

# Redis缓存配置
redis:
  url: "${REDIS_URL}"
  encoding: "utf-8"
  decode_responses: true
  require_tls: false
  max_connections: 50

  # 语义缓存配置
  semantic_cache:
    enabled: true
    ttl: 3600  # 1小时
    # Deterministic context-aware answer cache. This is not vector similarity.
    cache_version: "1"

# RabbitMQ配置
rabbitmq:
  url: "amqp://guest:guest@rabbitmq:5672/"
  queue_name: "document_processing"
  prefetch_count: 1

# 文档处理配置
document_processing:
  # 支持的文件类型
  supported_formats:
    - "pdf"
    - "docx"
    - "xlsx"
    - "md"
    - "txt"

  max_file_size: 104857600  # 100MB
  max_archive_entries: 5000
  max_archive_uncompressed_size: 536870912  # 512MB
  max_archive_compression_ratio: 200
  failed_upload_retention_seconds: 604800  # 7 days
  failed_upload_max_files: 100

  # PDF 解析 - MinerU (magic-pdf)
  pdf:
    engine: "pymupdf"
    parse_method: "auto"       # ocr | txt | auto
    device: "cuda"
    output_format: "md"        # md | md_dollar | json
    formula_enable: true       # 公式识别(LaTeX)
    table_enable: true         # 表格识别

  # 分块策略
  chunking:
    strategy: "parent_child"
    chunk_size: 800
    chunk_overlap: 120
    min_chunk_size: 80
    separators: ["\n# ", "\n## ", "\n### ", "\n\n", "\n", "。", "；", "，", ". ", "; ", ", ", " "]
    parent_child:
      enabled: true
      parent_size: 3200
      child_size: 800
      child_overlap: 200

# RAG配置
rag:
  # 检索配置
  retrieval:
    top_k: 10
    # 重排前的召回分兜底阈值，仅挡掉完全无关的召回；真正的相关性裁决交给重排器
    # （reranker.score_threshold，作用于 sigmoid 校准概率）。
    similarity_threshold: 0.05
    enable_rerank: true
    max_chunks_per_document: 12
    # 多查询召回后，用原始问题统一重排并动态裁剪生成上下文。
    dynamic_context_selection: true
    flat_score_top_n: 2
    min_final_rerank_spread: 0.05
    min_final_rerank_gap: 0.08
    enable_hybrid: false  # 混合检索（BM25+向量）
    alpha: 0.5  # 混合权重

  # 生成配置
  generation:
    system_prompt: |
      你是一个专业的问答助手。请基于提供的上下文信息回答用户问题。
      回答要求：
      1. 准确：严格基于上下文，不编造信息
      2. 完整：如果上下文不足以回答，明确说明
      3. 结构化：使用段落、列表组织答案
      4. 引用来源：在答案中标注信息来源

    max_context_length: 8000
    context_template: |
      ## 相关文档 {index}
      **来源**: {source}
      **相似度**: {score:.2f}

      {content}

    answer_template: |
      {answer}

      ---
      **参考文献**:
      {sources}

# 多模态配置
multimodal:
  # 图像处理
  image:
    max_size: 10485760  # 10MB
    resize: [1024, 1024]
    formats: ["png", "jpg", "jpeg", "webp"]

    # 图像嵌入模型
    embedding_model: "openai/clip-vit-base-patch32"
    device: "cuda"

  # 表格处理
  table:
    extraction_method: "pdfplumber"  # pdfplumber, camelot
    llm_parse: true  # 使用LLM理解表格语义

# 监控配置
monitoring:
  prometheus:
    enabled: true
    port: 9090
    path: "/internal/metrics"
    header_name: "X-Metrics-Token"
    token: "${RAG_METRICS_TOKEN}"

  metrics:
    - "request_count"
    - "request_duration"
    - "embedding_duration"
    - "llm_duration"
    - "cache_hit_rate"
    - "error_count"

# 日志配置
logging:
  level: "INFO"
  format: "json"
  handlers:
    - type: "stream"
      stream: "ext://sys.stdout"
    - type: "file"
      filename: "/app/logs/app.log"
      max_bytes: 10485760
      backup_count: 5

# 安全配置
security:
  # Standard OIDC validation; Keycloak is the default local IdP, but any
  # standards-compliant provider can be used.
  oidc:
    enabled: false
    issuer: "${OIDC_ISSUER}"
    audience: "${OIDC_AUDIENCE}"
    jwks_url: "${OIDC_JWKS_URL}"
    tenant_claim: "tenant_id"
    roles_claim: "realm_access.roles"
    algorithms: ["RS256"]

  # API认证
  api_key:
    enabled: true
    header_name: "X-API-Key"

  # CORS
  cors:
    enabled: true
    allow_origins: []
    allow_credentials: false
    allow_methods: ["*"]
    allow_headers: ["*"]

# 性能优化
performance:
  # 批处理
  batch_embedding: true
  batch_size: 32

  # 并发控制
  max_concurrent_requests: 100
  tenant_max_concurrent_requests: 10
  tenant_requests_per_minute: 120
  tenant_rate_limit_fail_open: false
  max_tracked_tenants: 10000
  request_queue_timeout_seconds: 5
  max_chat_total_chars: 60000
  max_chat_input_tokens: 16000
  gpu_inference_workers: 1
