[project]
name = "industrial-rag"
version = "1.0.0"
description = "Industrial-grade RAG system with Chinese and multimodal support"
authors = [{name = "Your Team"}]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}

dependencies = [
    # Core Framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",

    # LLM & RAG
    "transformers>=4.38.0",
    "torch>=2.2.0",
    "sentence-transformers>=2.3.0",

    # LLM API Clients
    "anthropic>=0.25.0",     # Claude
    "openai>=1.30.0",        # OpenAI-compatible (DeepSeek)
    "zhipuai>=2.0.0",        # 智谱AI

    # Vector Database
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.0",  # PostgreSQL sync driver

    # Document Processing. PyMuPDF is the default PDF parser in the runtime
    # image; MinerU is optional because its Torch/Transformers matrix differs.
    "PyMuPDF>=1.23.0",
    "python-docx>=1.1.0",      # Word
    "openpyxl>=3.1.0",         # Excel
    "pandas>=2.2.0",

    # Message Queue
    "celery[redis]>=5.3.0",

    # Monitoring & Logging
    "prometheus-client>=0.20.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",

    # HTTP & Network
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",

    # Configuration
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",

    # Utils
    "tiktoken>=0.6.0",
]

[project.optional-dependencies]
legacy-ui = [
    "streamlit>=1.30.0",
]

llama-index = [
    "llama-index>=0.10.0",
    "llama-index-llms-vllm>=0.1.0",
    "llama-index-embeddings-huggingface>=0.1.0",
]

multimodal = [
    "open-clip-torch>=2.24.0",
    "timm>=0.9.0",
    "pillow>=10.2.0",
    "python-pptx>=0.6.23",
]

rabbitmq = [
    "aio-pika>=9.4.0",
]

mineru = [
    "magic-pdf[full]>=0.7.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",  # for TestClient
    "ruff>=0.2.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
    "ipython>=8.21.0",
    "jupyter>=1.0.0",
]

benchmark = [
    "locust>=2.20.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

# Ragas 0.4.3 still imports integrations removed by LangChain Community 0.4.
# Keep this optional evaluation stack pinned until upstream relaxes that coupling.
evaluation = [
    "ragas==0.4.3",
    "langchain==0.3.27",
    "langchain-community==0.3.31",
    "langchain-core==0.3.80",
    "langchain-openai==0.3.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pymilvus.*",
    "magic_pdf.*",
    "FlagEmbedding.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=app --cov-report=html --cov-report=term-missing --basetemp=.pytest_tmp -p no:cacheprovider"

[tool.coverage.report]
# Ratchet this upward as PostgreSQL, cache, model and upload integration tests land.
fail_under = 60
